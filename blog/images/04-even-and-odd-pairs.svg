<text x="572.0" y="105.0" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="start" font-style="italic">sits out</text>
<text x="572.0" y="286.9" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="start" font-style="italic">sits out</text>
<text x="400.0" y="340.0" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">Alternating the pairs lets material cross every boundary between rows.</text>
<text x="400.0" y="362.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">The same trick is used for the two diagonal directions.</text>
