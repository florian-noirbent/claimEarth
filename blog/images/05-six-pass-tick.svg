<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>One tick = six passes, always in this order</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="798" height="278" rx="14" fill="#ffffff" stroke="#e3e7ec" stroke-width="2"/>
<text x="28" y="40" font-size="21" font-weight="700" fill="#1f2933">One tick = six passes, always in this order</text>
<rect x="40.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="2" opacity="1.0"/>
<text x="56.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">1</text>
<line x1="95.0" y1="110.0" x2="95.0" y2="150.0" stroke="#2f6fde" stroke-width="3" marker-end="url(#ah-accent)"/>
<text x="95.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">vertical</text>
<line x1="151.0" y1="135.0" x2="161.0" y2="135.0" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="163.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="2" opacity="1.0"/>
<text x="179.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">2</text>
<line x1="200.7" y1="120.0" x2="235.3" y2="140.0" stroke="#2f6fde" stroke-width="3" marker-end="url(#ah-accent)"/>
<text x="218.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">down-right</text>
<line x1="274.0" y1="135.0" x2="284.0" y2="135.0" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="286.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="2" opacity="1.0"/>
<text x="302.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">3</text>
<line x1="358.3" y1="120.0" x2="323.7" y2="140.0" stroke="#2f6fde" stroke-width="3" marker-end="url(#ah-accent)"/>
<text x="341.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">down-left</text>
<line x1="397.0" y1="135.0" x2="407.0" y2="135.0" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="409.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#fff1e0" stroke="#e09a3e" stroke-width="2" opacity="1.0"/>
<text x="425.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">4</text>
<line x1="464.0" y1="110.0" x2="464.0" y2="150.0" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-ink)"/>
<text x="464.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">vertical</text>
<line x1="520.0" y1="135.0" x2="530.0" y2="135.0" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="532.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#fff1e0" stroke="#e09a3e" stroke-width="2" opacity="1.0"/>
<text x="548.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">5</text>
<line x1="569.7" y1="120.0" x2="604.3" y2="140.0" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-ink)"/>
<text x="587.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">down-right</text>
<line x1="643.0" y1="135.0" x2="653.0" y2="135.0" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="655.0" y="80.0" width="110.0" height="110.0" rx="8" fill="#fff1e0" stroke="#e09a3e" stroke-width="2" opacity="1.0"/>
<text x="671.0" y="102.0" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">6</text>
<line x1="727.3" y1="120.0" x2="692.7" y2="140.0" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-ink)"/>
<text x="710.0" y="172.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">down-left</text>
<line x1="40.0" y1="205.0" x2="396.0" y2="205.0" stroke="#2f6fde" stroke-width="2"/>
<line x1="40.0" y1="199.0" x2="40.0" y2="211.0" stroke="#2f6fde" stroke-width="2"/>
<line x1="396.0" y1="199.0" x2="396.0" y2="211.0" stroke="#2f6fde" stroke-width="2"/>
<text x="218.0" y="226.0" font-size="14" font-weight="600" fill="#2f6fde" text-anchor="middle">even pairs</text>
<line x1="409.0" y1="205.0" x2="765.0" y2="205.0" stroke="#1f2933" stroke-width="2"/>
<line x1="409.0" y1="199.0" x2="409.0" y2="211.0" stroke="#1f2933" stroke-width="2"/>
<line x1="765.0" y1="199.0" x2="765.0" y2="211.0" stroke="#1f2933" stroke-width="2"/>
<text x="587.0" y="226.0" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">odd pairs</text>
<text x="400.0" y="262.0" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">10 ticks per second  =  60 passes per second</text>
</svg>
