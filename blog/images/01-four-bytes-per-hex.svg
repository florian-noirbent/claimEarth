<polygon points="200.0,120.0 185.0,146.0 155.0,146.0 140.0,120.0 155.0,94.0 185.0,94.0" fill="#eef2f6" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="110.0,172.0 95.0,197.9 65.0,197.9 50.0,172.0 65.0,146.0 95.0,146.0" fill="#e2b65a" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="155.0,197.9 140.0,223.9 110.0,223.9 95.0,197.9 110.0,172.0 140.0,172.0" fill="#4a90d9" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="200.0,172.0 185.0,197.9 155.0,197.9 140.0,172.0 155.0,146.0 185.0,146.0" fill="#eef2f6" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="110.0,223.9 95.0,249.9 65.0,249.9 50.0,223.9 65.0,197.9 95.0,197.9" fill="#8d6a4a" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="155.0,249.9 140.0,275.9 110.0,275.9 95.0,249.9 110.0,223.9 140.0,223.9" fill="#8d6a4a" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="200.0,223.9 185.0,249.9 155.0,249.9 140.0,223.9 155.0,197.9 185.0,197.9" fill="#4a90d9" stroke="#ffffff" stroke-width="2" opacity="1.0"/>
<polygon points="155.0,197.9 140.0,223.9 110.0,223.9 95.0,197.9 110.0,172.0 140.0,172.0" fill="none" stroke="#2f6fde" stroke-width="4" opacity="1.0"/>
<text x="125.0" y="300.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">one hex on screen</text>
<line x1="195.0" y1="185.0" x2="255.0" y2="185.0" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-accent)"/>
<rect x="265.0" y="160.0" width="50.0" height="50.0" rx="3" fill="#4a90d9" stroke="#2f6fde" stroke-width="3" opacity="1.0"/>
<text x="290.0" y="235.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">one texel</text>
<line x1="325.0" y1="185.0" x2="380.0" y2="185.0" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-accent)"/>
<text x="582.0" y="128.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle" font-style="italic">these bytes are data, not colors</text>
<rect x="390.0" y="145.0" width="90.0" height="80.0" rx="8" fill="#efe6fb" stroke="#8a63c9" stroke-width="2" opacity="1.0"/>
<text x="435.0" y="195.0" font-size="28" font-weight="700" fill="#8a63c9" text-anchor="middle">R</text>
<line x1="435.0" y1="205.0" x2="435.0" y2="222.0" stroke="#9aa5b1" stroke-width="1"/>
<text x="414.0" y="219.0" font-size="10" font-weight="400" fill="#5f6b7a" text-anchor="middle">ID 1</text>
<text x="457.0" y="219.0" font-size="10" font-weight="400" fill="#5f6b7a" text-anchor="middle">ID 2</text>
<text x="435.0" y="250.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">2 material IDs</text>
<text x="435.0" y="266.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(4 bits each)</text>
<rect x="488.0" y="145.0" width="90.0" height="80.0" rx="8" fill="#e3f5ea" stroke="#2e9e5b" stroke-width="2" opacity="1.0"/>
<text x="533.0" y="195.0" font-size="28" font-weight="700" fill="#2e9e5b" text-anchor="middle">G</text>
<text x="533.0" y="250.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">primary</text>
<text x="533.0" y="266.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">quantity</text>
<rect x="586.0" y="145.0" width="90.0" height="80.0" rx="8" fill="#e6efff" stroke="#2f6fde" stroke-width="2" opacity="1.0"/>
<text x="631.0" y="195.0" font-size="28" font-weight="700" fill="#2f6fde" text-anchor="middle">B</text>
<text x="631.0" y="250.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">light</text>
<rect x="684.0" y="145.0" width="90.0" height="80.0" rx="8" fill="#fff1e0" stroke="#e09a3e" stroke-width="2" opacity="1.0"/>
<text x="729.0" y="195.0" font-size="28" font-weight="700" fill="#e09a3e" text-anchor="middle">A</text>
<text x="729.0" y="250.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">secondary</text>
<text x="729.0" y="266.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">quantity</text>
<text x="400.0" y="320.0" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100 × 512 cells × 4 bytes = 200 KiB for the whole world</text>
</svg>
