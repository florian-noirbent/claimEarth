<polygon points="178.0,186.6 146.0,242.0 82.0,242.0 50.0,186.6 82.0,131.1 146.0,131.1" fill="#8d6a4a" stroke="#8d6a4a" stroke-width="1.5" opacity="1.0"/>
<polygon points="370.0,186.6 338.0,242.0 274.0,242.0 242.0,186.6 274.0,131.1 338.0,131.1" fill="#8d6a4a" stroke="#8d6a4a" stroke-width="1.5" opacity="1.0"/>
<polygon points="274.0,352.9 242.0,408.3 178.0,408.3 146.0,352.9 178.0,297.4 242.0,297.4" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5" opacity="1.0"/>
<polygon points="178.0,297.4 146.0,352.9 82.0,352.9 50.0,297.4 82.0,242.0 146.0,242.0" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5" opacity="1.0"/>
