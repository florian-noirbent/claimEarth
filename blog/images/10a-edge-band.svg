<polygon points="274.0,242.0 242.0,297.4 178.0,297.4 146.0,242.0 178.0,186.6 242.0,186.6" fill="#8d6a4a" stroke="#8d6a4a" stroke-width="1.5" opacity="1.0"/>
<path d="M 274.0,242.0 L 242.0,297.4 L 178.0,297.4 L 146.0,242.0 L 178.0,186.6 L 242.0,186.6 Z M 245.2,242.0 L 227.6,272.5 L 192.4,272.5 L 174.8,242.0 L 192.4,211.5 L 227.6,211.5 Z" fill="#ffb347" fill-opacity="0.8" fill-rule="evenodd"/>
<polygon points="274.0,242.0 242.0,297.4 178.0,297.4 146.0,242.0 178.0,186.6 242.0,186.6" fill="none" stroke="#2f6fde" stroke-width="2.5" opacity="1.0"/>
<circle cx="210.0" cy="242.0" r="9" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="210.0" y="246.5" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">1</text>
<circle cx="210.0" cy="198.8" r="9" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="210.0" y="203.3" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">2</text>
<circle cx="210.0" cy="285.2" r="9" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="210.0" y="289.7" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">3</text>
<rect x="420.0" y="72.0" width="18.0" height="18.0" rx="3" fill="#ffb347" stroke="#ffb347" stroke-width="1.5" opacity="0.8"/>
<text x="446.0" y="86.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">edge band of the highlighted hex</text>
<circle cx="432" cy="145" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="432.0" y="150.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">1</text>
<text x="454.0" y="150.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Far from every edge</text>
<text x="454.0" y="170.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">draw this cell's material</text>
<text x="454.0" y="187.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">(most pixels stop here)</text>
<circle cx="432" cy="230" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="432.0" y="235.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">2</text>
<text x="454.0" y="235.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Same material across the edge</text>
<text x="454.0" y="255.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">draw this cell's material:</text>
<text x="454.0" y="272.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">no seam between dirt cells</text>
<circle cx="432" cy="315" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="432.0" y="320.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">3</text>
<text x="454.0" y="320.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Different material across the edge</text>
<text x="454.0" y="340.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">decide which material owns</text>
<text x="454.0" y="357.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">the pixel (next diagram)</text>
</svg>
