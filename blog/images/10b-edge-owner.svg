<text x="345.0" y="168.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">dirt</text>
<text x="460.0" y="168.0" font-size="14" font-weight="700" fill="#5f6b7a" text-anchor="middle">air</text>
<text x="400.0" y="254.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">same noise on both sides,</text>
<text x="400.0" y="270.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">so both cells agree</text>
<text x="660.0" y="82.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">3. The owner's outline</text>
