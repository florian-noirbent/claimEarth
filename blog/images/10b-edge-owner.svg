<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Drawing a boundary between two materials</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="1" y="1" width="798" height="308" rx="14" fill="#ffffff" stroke="#e3e7ec" stroke-width="2"/>
<text x="28" y="40" font-size="21" font-weight="700" fill="#1f2933">Drawing a boundary between two materials</text>
<text x="140.0" y="82.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">1. The hex edge</text>
<rect x="40.0" y="98.0" width="200.0" height="130.0" rx="6" fill="#eef2f6" stroke="#e3e7ec" stroke-width="1.5" opacity="1.0"/>
<path d="M 40 98 L 140.0 98.0 L 140.0 228.0 L 40 228 Z" fill="#8d6a4a"/>
<text x="85.0" y="168.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">dirt</text>
<text x="200.0" y="168.0" font-size="14" font-weight="700" fill="#5f6b7a" text-anchor="middle">air</text>
<text x="140.0" y="254.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">dirt is denser,</text>
<text x="140.0" y="270.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">so dirt owns the edge</text>
<text x="400.0" y="82.0" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">2. Noise moves it</text>
<rect x="300.0" y="98.0" width="200.0" height="130.0" rx="6" fill="#eef2f6" stroke="#e3e7ec" stroke-width="1.5" opacity="1.0"/>
