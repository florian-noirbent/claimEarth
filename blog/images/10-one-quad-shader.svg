<rect x="110.0" y="112.0" width="18.0" height="18.0" rx="1" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<rect x="110.0" y="132.0" width="18.0" height="18.0" rx="1" fill="#2f6fde" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<rect x="110.0" y="152.0" width="18.0" height="18.0" rx="1" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<rect x="130.0" y="112.0" width="18.0" height="18.0" rx="1" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<rect x="130.0" y="132.0" width="18.0" height="18.0" rx="1" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<rect x="130.0" y="152.0" width="18.0" height="18.0" rx="1" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" opacity="1.0"/>
<text x="110.0" y="198.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">for every pixel</text>
<text x="110.0" y="214.9" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">of the one quad</text>
